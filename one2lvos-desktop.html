<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One2lvOS Web Environment</title>
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for beautiful icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts for modern typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* High-quality default wallpaper */
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            overflow: hidden;
            user-select: none;
        }

        /* Custom scrollbar for inner windows */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .window {
            transition: width 0.2s, height 0.2s, background-color 0.2s, box-shadow 0.2s;
        }
        .window.maximized {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="text-gray-800 w-screen h-screen flex flex-col relative">

    <!-- Desktop Area -->
    <main id="desktop" class="flex-1 relative z-0">
        <div id="desktop-icons" class="absolute top-0 left-0 bottom-12 right-0 p-4 flex flex-col flex-wrap content-start gap-2 z-0"></div>

    <!-- Start Menu -->

            <div class="grid grid-cols-4 gap-y-6 gap-x-2" id="start-menu-grid"></div>

        <div class="mt-4 pt-4 border-t border-gray-300/50 flex justify-between items-center bg-white/30 -mx-6 -mb-6 px-6 py-4 rounded-b-2xl">

        </div>
    </div>

    <!-- Taskbar -->

            <div class="w-px h-6 bg-white/20 mx-1"></div>

            <div id="taskbar-apps" class="flex gap-1.5 items-center h-full"></div>
        </div>

            <div class="flex items-center gap-3 hover:bg-white/10 px-3 py-1.5 rounded-lg cursor-pointer transition-colors h-10">

            </div>

        // One2lvOS Terminal Commands
        async function handleOne2lvTerminal(e) {
            if(e.key !== 'Enter') return;

            const input = e.target;
            const cmd = input.value.trim();
            const output = document.getElementById('one2lv-output');

            // Echo command
            const cmdLine = document.createElement('div');
            cmdLine.className = 'mb-2';
            cmdLine.innerHTML = `<span class="text-blue-400">one2lv@OS:~$</span> <span class="text-white">${cmd}</span>`;
            output.appendChild(cmdLine);

            input.value = '';

            if (!cmd) return;

            const parts = cmd.split(/\s+/);
            const mainCmd = parts[0].toLowerCase();
            const args = parts.slice(1);

            let response = '';

            try {
                if (mainCmd === 'help') {
                    response = `<div class="text-cyan-400">One2lvOS Terminal Commands:</div>
<div class="text-gray-300 mt-2">
  help          - Show this message
  status        - Show service status
  services      - List all services
  version       - System version
  arcade [cmd]  - AI Arcade (info, list, leaderboard)
  clear         - Clear terminal
  date          - Show current date
  whoami        - Show current user
</div>`;
                } else if (mainCmd === 'status') {
                    response = '<div class="text-yellow-400">Checking services...</div>';
                    const services = await checkAllServices();
                    response = `<div class="text-cyan-400">One2lvOS Service Status:</div>\n${services}`;
                } else if (mainCmd === 'services') {
                    response = `<div class="text-cyan-400">One2lvOS Services:</div>
<div class="text-gray-300 mt-2">
  Lumenis Reactor  - Port 8000  (FastAPI + WS, ITT Council)
  Witness Proxy    - Port 3001  (Minimax NVIDIA NIM proxy)
  One2lvOS Core    - Port 3002  (Flask core)
  Sovereign Core   - Port 3003  (FastAPI control-plane)
  AI Arcade MCP    - Port 8003  (Python MCP server)
  Lumenis v7       - Port 8005  (Node.js Cosmic)
  AI Lobby         - Port 8006  (Agent hub/registry)
  Minimax Core     - Port 8080  (Node.js minimax/minimax-01)
  SteamOS Dash     - Port 8081  (Python dashboard)
  Unified Gateway  - Port 8888  (FastAPI gateway)
  Lumenis UI       - Port 9001  (Static frontend)
  LumenisOS API    - Port 9002  (Node.js API server)
  Aetherix         - Port 9003  (Master terminal)
</div>`;
                } else if (mainCmd === 'version') {
                    response = `<div class="text-cyan-400">One2lvOS Version 2.0.0</div>
<div class="text-gray-400">AI-Powered Spatial Computing OS</div>
<div class="text-gray-500">Hosted: https://one2lv.com/OS</div>`;
                } else if (mainCmd === 'arcade') {
                    const subcmd = args[0] || 'info';
                    response = '<div class="text-yellow-400">Contacting AI Arcade...</div>';
                    const res = await arcadeAPI(subcmd);
                    response = `<div class="text-green-400">${res}</div>`;
                } else if (mainCmd === 'clear') {
                    output.innerHTML = '';
                    return;
                } else if (mainCmd === 'date') {
                    response = '<div class="text-gray-300">' + new Date().toString() + '</div>';
                } else if (mainCmd === 'whoami') {
                    response = '<div class="text-gray-300">Administrator</div>';
                } else if (cmd) {
                    response = `<div class="text-red-400">Command not found: ${mainCmd}</div>`;
                }
            } catch (err) {
                response = `<div class="text-red-400">Error: ${err.message}</div>`;
            }

            const resLine = document.createElement('div');
            resLine.className = 'mb-3';
            resLine.innerHTML = response;
            output.appendChild(resLine);
            output.scrollTop = output.scrollHeight;
        }

        // AI Arcade API calls
        async function arcadeAPI(cmd) {
            try {
                const toolMap = {
                    'info': 'arcade_info',
                    'list': 'list_games',
                    'leaderboard': 'get_leaderboard',
                    'library': 'library_list'
                };

                const tool = toolMap[cmd] || 'arcade_info';
                const res = await fetch(`${ARCADE}/mcp`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: Date.now(),
                        method: 'tools/call',
                        params: {name: tool, arguments: {}}
                    })
                });

                const data = await res.json();
                return data?.result?.content?.[0]?.text || 'No response';
            } catch (err) {
                return `Error: ${err.message}`;
            }
        }

            const now = new Date();
            const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            const dateString = now.toLocaleDateString();
            document.getElementById('taskbar-time').innerHTML = `
                <div class="text-xs font-medium tracking-wide">${timeString}</div>
                <div class="text-[10px] opacity-80 mt-0.5">${dateString}</div>
            `;
        }
        setInterval(updateClock, 1000);
        updateClock();

        function bringToFront(appId) {
            const win = document.getElementById(`window-${appId}`);
            if (win) {
                highestZ++;
                win.style.zIndex = highestZ;
            }
        }

        function openApp(appId) {
            if (openApps[appId]) {
                const win = document.getElementById(`window-${appId}`);
                win.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                bringToFront(appId);
                updateTaskbar();
                return;
            }

            const app = apps[appId];
            openApps[appId] = true;

            const win = document.createElement('div');
            win.id = `window-${appId}`;
            win.className = `window absolute bg-white/90 backdrop-blur-2xl rounded-xl shadow-[0_20px_60px_rgba(0,0,0,0.3)] border border-white/60 flex flex-col overflow-hidden`;

            const offset = Object.keys(openApps).length * 25;
            win.style.width = app.width + 'px';
            win.style.height = app.height + 'px';
            win.style.top = `max(10%, calc(50% - ${app.height/2}px + ${offset}px))`;
            win.style.left = `max(10%, calc(50% - ${app.width/2}px + ${offset}px))`;
            win.style.zIndex = ++highestZ;

            win.innerHTML = `
                <div class="window-header h-10 bg-white/40 backdrop-blur-md flex justify-between items-center px-4 cursor-move border-b border-gray-200/50 select-none">
                    <div class="flex items-center gap-2 font-medium text-gray-800 pointer-events-none">
                        <i class="${app.icon} ${app.color} drop-shadow-sm"></i>
                        <span class="text-xs font-semibold tracking-wide">${app.name}</span>
                    </div>
                    <div class="window-controls flex gap-2.5 items-center">
                        <button onclick="minimizeApp('${appId}')" class="w-3.5 h-3.5 rounded-full bg-yellow-400 hover:bg-yellow-500 focus:outline-none shadow-sm flex items-center justify-center group"><i class="fas fa-minus text-[6px] opacity-0 group-hover:opacity-100 text-yellow-900 transition-opacity"></i></button>
                        <button onclick="maximizeApp('${appId}')" class="w-3.5 h-3.5 rounded-full bg-green-400 hover:bg-green-500 focus:outline-none shadow-sm flex items-center justify-center group"><i class="fas fa-expand-alt text-[6px] opacity-0 group-hover:opacity-100 text-green-900 transition-opacity"></i></button>
                        <button onclick="closeApp('${appId}')" class="w-3.5 h-3.5 rounded-full bg-red-400 hover:bg-red-500 focus:outline-none shadow-sm flex items-center justify-center group"><i class="fas fa-times text-[7px] opacity-0 group-hover:opacity-100 text-red-900 transition-opacity"></i></button>
                    </div>
                </div>
                <div class="window-content flex-1 overflow-hidden relative">
                    ${app.content}
                </div>
            `;

            document.getElementById('desktop').appendChild(win);
            makeDraggable(win, win.querySelector('.window-header'));

            if (app.onOpen) {
                setTimeout(() => app.onOpen(appId), 50);
            }

            updateTaskbar();

            const menu = document.getElementById('start-menu');
            if(!menu.classList.contains('opacity-0')) {
                toggleStartMenu();
            }
        }

        function minimizeApp(appId) {
            const win = document.getElementById(`window-${appId}`);
            if(win) {
                win.classList.add('opacity-0', 'scale-95', 'pointer-events-none');
            }
            updateTaskbar();
        }

        function maximizeApp(appId) {
            const win = document.getElementById(`window-${appId}`);
            if(win) {
                if(win.classList.contains('maximized')) {
                    win.classList.remove('maximized');
                    win.style.width = win.dataset.prevW;
                    win.style.height = win.dataset.prevH;
                    win.style.left = win.dataset.prevX;
                    win.style.top = win.dataset.prevY;
                    win.style.borderRadius = '0.75rem';
                } else {
                    win.dataset.prevW = win.style.width;
                    win.dataset.prevH = win.style.height;
                    win.dataset.prevX = win.style.left;
                    win.dataset.prevY = win.style.top;
                    win.classList.add('maximized');
                    win.style.top = '0px';
                    win.style.left = '0px';
                    win.style.width = '100%';
                    win.style.height = 'calc(100vh - 3.5rem)';
                    win.style.borderRadius = '0px';
                }
            }
        }

        function closeApp(appId) {
            const win = document.getElementById(`window-${appId}`);
            if(win) {
                if(apps[appId].onClose) apps[appId].onClose(appId, win);
                win.classList.add('opacity-0', 'scale-95');
                setTimeout(() => win.remove(), 200);
            }
            delete openApps[appId];
            updateTaskbar();
        }

        function makeDraggable(win, header) {
            let isDragging = false;
            let startX, startY, initialX, initialY;

            header.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.window-controls')) return;
                isDragging = true;
                bringToFront(win.id.replace('window-', ''));
                startX = e.clientX;
                startY = e.clientY;
                initialX = win.offsetLeft;
                initialY = win.offsetTop;
                header.setPointerCapture(e.pointerId);
            });

            header.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                win.style.left = `${initialX + dx}px`;
                win.style.top = `${Math.max(0, initialY + dy)}px`;
            });

            header.addEventListener('pointerup', (e) => {
                isDragging = false;
                header.releasePointerCapture(e.pointerId);
            });
        }

        function updateTaskbar() {
            const tbApps = document.getElementById('taskbar-apps');
            tbApps.innerHTML = '';

            Object.keys(openApps).forEach(appId => {
                const app = apps[appId];
                const win = document.getElementById(`window-${appId}`);
                if (!win) return;

                const isHidden = win.classList.contains('opacity-0');
                const isTop = win.style.zIndex == highestZ && !isHidden;

                const btn = document.createElement('button');
                btn.className = `w-11 h-11 rounded-lg flex items-center justify-center transition-all ${isTop ? 'bg-white/20 shadow-inner' : 'hover:bg-white/10'} group relative`;

                btn.onclick = () => {
                    if (isHidden) {
                        win.classList.remove('opacity-0', 'scale-95', 'pointer-events-none');
                        bringToFront(appId);
                    } else {
                        if (isTop) {
                            minimizeApp(appId);
                        } else {
                            bringToFront(appId);
                        }
                    }
                    updateTaskbar();
                };

                btn.innerHTML = `
                    <i class="${app.icon} ${app.color} text-[22px] drop-shadow-sm transition-transform group-active:scale-90"></i>
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-3.5 h-1 rounded-t-sm ${isTop ? 'bg-blue-400' : 'bg-gray-400'} shadow transition-all"></div>
                `;
                tbApps.appendChild(btn);
            });
        }

        // Calculator Logic
        window.calcInput = function(val) {
            const display = document.getElementById('calc-display');
            if(display.innerText === '0' || display.dataset.clearNext === 'true') {
                display.innerText = val;
                display.dataset.clearNext = 'false';
            } else {
                display.innerText += val;
            }
        };

        window.calcOp = function(op) {
            const display = document.getElementById('calc-display');
            const history = document.getElementById('calc-history');

            if (op === 'C') {
                display.innerText = '0';
                history.innerText = '';
                display.dataset.val1 = '';
                display.dataset.op = '';
            } else if (op === 'DEL') {
                if(display.dataset.clearNext === 'true') return;
                display.innerText = display.innerText.length > 1 ? display.innerText.slice(0, -1) : '0';
            } else if (op === '=') {
                if (display.dataset.op && display.dataset.val1) {
                    try {
                        const v1 = parseFloat(display.dataset.val1);
                        const v2 = parseFloat(display.innerText);
                        let res = 0;
                        switch(display.dataset.op) {
                            case '+': res = v1 + v2; break;
                            case '-': res = v1 - v2; break;
                            case '×': res = v1 * v2; break;
                            case '÷': res = v1 / v2; break;
                        }
                        history.innerText = `${v1} ${display.dataset.op} ${v2} =`;
                        let resStr = res.toString();
                        if(resStr.length > 12) resStr = res.toPrecision(10);
                        display.innerText = resStr;
                    } catch(e) {
                        display.innerText = 'Error';
                    }
                    display.dataset.clearNext = 'true';
                    display.dataset.op = '';
                }
            } else {
                display.dataset.val1 = display.innerText;
                display.dataset.op = op;
                history.innerText = `${display.innerText} ${op}`;
                display.dataset.clearNext = 'true';
            }
        }

        // AI Lobby functions

            const endpoints = {
                manifest: { url: LOBBY + '/', method: 'GET' },
                agents:   { url: LOBBY + '/agents', method: 'GET' },
                systems:  { url: LOBBY + '/systems', method: 'GET' },
                broadcast:{ url: LOBBY + '/broadcast', method: 'GET' }
            };
            const ep = endpoints[cmd];
            if (!ep) return;
            try {
                const r = await fetch(ep.url, { method: ep.method, signal: AbortSignal.timeout(5000) });
                const d = await r.json();
                output.textContent = JSON.stringify(d, null, 2);
            } catch (e) {
                output.textContent = '[Lobby offline or unreachable] ' + e.message + '\n\nTo start: python3 ai_lobby.py';

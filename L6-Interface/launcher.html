<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One2lvOS • L6 Interface Launcher</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #020617 0%, #0f172a 50%, #1e1b4b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            color: #00f5ff;
            overflow: hidden;
        }

        .launcher {
            text-align: center;
            background: rgba(10, 10, 30, 0.94);
            border: 1px solid rgba(0, 245, 255, 0.4);
            border-radius: 20px;
            padding: 60px 80px;
            box-shadow: 0 0 60px rgba(0, 245, 255, 0.2);
            backdrop-filter: blur(10px);
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 60px rgba(0, 245, 255, 0.2); }
            50% { box-shadow: 0 0 80px rgba(168, 85, 247, 0.4); }
        }

        h1 {
            font-size: 42px;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 40px;
            letter-spacing: 3px;
        }

        .launch-btn {
            background: linear-gradient(135deg, #00f5ff, #a855f7);
            color: #020617;
            border: none;
            padding: 18px 50px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.3);
        }

        .launch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(168, 85, 247, 0.5);
        }

        .stats {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
            font-size: 11px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            color: #00ff00;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .protocol-links {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .protocol-link {
            color: #00ff00;
            text-decoration: none;
            font-size: 10px;
            padding: 8px 16px;
            border: 1px solid #00ff00;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .protocol-link:hover {
            background: #00ff00;
            color: #020617;
        }
    </style>
</head>
<body>
    <div class="launcher">
        <h1>ONE2LVOS</h1>
        <div class="subtitle">SOVEREIGN LATTICE • L6 INTERFACE</div>

        <button class="launch-btn" onclick="launchL6()">LAUNCH ORBITAL VIEW</button>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-value">73Hz</div>
                <div class="stat-label">Resonance</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">18.0°C</div>
                <div class="stat-label">Baseline</div>
            </div>
            <div class="stat-item">
                <div class="stat-value">9.6</div>
                <div class="stat-label">Phase</div>
            </div>
        </div>

        <div class="protocol-links">
            <a href="protocol-1164.html" class="protocol-link" target="_blank">PROTOCOL 0x1164</a>
            <a href="protocol-1165.html" class="protocol-link" target="_blank">PROTOCOL 0x1165</a>
            <a href="protocol-1166.html" class="protocol-link" target="_blank">PROTOCOL 0x1166</a>
        </div>
    </div>

    <script>
        function launchL6() {
            window.location.href = 'index.html';
        }

        // Audio context unlock on click
        document.addEventListener('click', function() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            audioContext.resume();
        }, { once: true });
    </script>
</body>
</html>

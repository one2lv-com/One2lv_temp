<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One2lvOS Network Manager - WebDAV & FTP Mesh Routing</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-connected { background-color: #10b981; }
        .status-disconnected { background-color: #6b7280; }
        .status-connecting { background-color: #f59e0b; animation: pulse 1.5s infinite; }
        .status-error { background-color: #ef4444; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .connection-card {
            transition: all 0.3s ease;
        }
        .connection-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="min-h-screen p-6">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                        <i class="fas fa-network-wired text-white text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-gray-800">Network Manager</h1>
                        <p class="text-gray-500">Static Connections & Mesh Routing</p>
                    </div>
                </div>
                <button onclick="showAddConnectionModal()" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all">
                    <i class="fas fa-plus mr-2"></i>New Connection
                </button>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-4 gap-4 mt-6">
                <div class="bg-gradient-to-br from-blue-50 to-blue-100 p-4 rounded-xl">
                    <div class="text-blue-600 text-sm font-semibold">Total Connections</div>
                    <div class="text-3xl font-bold text-blue-900" id="stat-total">0</div>
                </div>
                <div class="bg-gradient-to-br from-green-50 to-green-100 p-4 rounded-xl">
                    <div class="text-green-600 text-sm font-semibold">Active</div>
                    <div class="text-3xl font-bold text-green-900" id="stat-active">0</div>
                </div>
                <div class="bg-gradient-to-br from-purple-50 to-purple-100 p-4 rounded-xl">
                    <div class="text-purple-600 text-sm font-semibold">Protocols</div>
                    <div class="text-3xl font-bold text-purple-900" id="stat-protocols">2</div>
                </div>
                <div class="bg-gradient-to-br from-orange-50 to-orange-100 p-4 rounded-xl">
                    <div class="text-orange-600 text-sm font-semibold">Mesh Nodes</div>
                    <div class="text-3xl font-bold text-orange-900" id="stat-nodes">1</div>
                </div>
            </div>
        </div>

        <!-- Connections Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="connections-grid">
            <!-- Connection cards will be dynamically inserted here -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="bg-white rounded-2xl shadow-2xl p-12 text-center hidden">
            <i class="fas fa-plug text-6xl text-gray-300 mb-4"></i>
            <h3 class="text-2xl font-bold text-gray-700 mb-2">No Connections</h3>
            <p class="text-gray-500 mb-6">Create your first static connection to get started</p>
            <button onclick="showAddConnectionModal()" class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-3 rounded-xl font-semibold hover:shadow-lg transition-all">
                <i class="fas fa-plus mr-2"></i>Add Connection
            </button>
        </div>
    </div>

    <!-- Add Connection Modal -->
    <div id="add-connection-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold text-gray-800">
                        <i class="fas fa-plug text-blue-500 mr-2"></i>New Connection
                    </h2>
                    <button onclick="hideAddConnectionModal()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
            </div>

            <form id="connection-form" class="p-6 space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Connection Name</label>
                    <input type="text" name="name" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="My WebDAV Server">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Protocol</label>
                    <select name="protocol" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" onchange="updateProtocolFields()">
                        <option value="webdav">WebDAV</option>
                        <option value="ftp">FTP</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Host</label>
                        <input type="text" name="host" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="example.com">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Port</label>
                        <input type="number" name="port" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="80">
                    </div>
                </div>

                <div id="path-field">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Path</label>
                    <input type="text" name="path" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="/webdav" value="/">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                        <input type="text" name="username" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="admin">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                        <input type="password" name="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="••••••••">
                    </div>
                </div>

                <div class="flex items-center gap-6">
                    <label class="flex items-center">
                        <input type="checkbox" name="persistent" checked class="w-5 h-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">Persistent Connection</span>
                    </label>
                    <label class="flex items-center">
                        <input type="checkbox" name="autoReconnect" checked class="w-5 h-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-500">
                        <span class="ml-2 text-sm font-medium text-gray-700">Auto Reconnect</span>
                    </label>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="testConnection()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-lg font-semibold hover:bg-gray-200 transition-all">
                        <i class="fas fa-vial mr-2"></i>Test Connection
                    </button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 rounded-lg font-semibold hover:shadow-lg transition-all">
                        <i class="fas fa-save mr-2"></i>Save Connection
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- File Browser Modal -->
    <div id="file-browser-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-4xl mx-4 max-h-[90vh] flex flex-col">
            <div class="p-6 border-b">
                <div class="flex items-center justify-between">
                    <h2 class="text-2xl font-bold text-gray-800">
                        <i class="fas fa-folder-open text-blue-500 mr-2"></i>
                        <span id="browser-title">File Browser</span>
                    </h2>
                    <button onclick="hideFileBrowser()" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <div class="mt-4 flex items-center gap-2 text-sm text-gray-600">
                    <i class="fas fa-folder text-yellow-500"></i>
                    <span id="current-path">/</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-6">
                <div id="file-list" class="space-y-2">
                    <!-- Files will be listed here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let connections = [];
        let currentConnectionId = null;

        // Load connections on page load
        window.onload = () => {
            loadConnections();
        };

        async function loadConnections() {
            try {
                const response = await fetch(`${API_BASE}/api/network/connections`);
                connections = await response.json();
                renderConnections();
                updateStats();
            } catch (error) {
                console.error('Failed to load connections:', error);
                showEmptyState();
            }
        }

        function renderConnections() {
            const grid = document.getElementById('connections-grid');
            const emptyState = document.getElementById('empty-state');

            if (connections.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = connections.map(conn => createConnectionCard(conn)).join('');
        }

        function createConnectionCard(conn) {
            const statusColors = {
                connected: 'status-connected',
                disconnected: 'status-disconnected',
                connecting: 'status-connecting',
                error: 'status-error'
            };

            const protocolIcons = {
                webdav: 'fa-cloud',
                ftp: 'fa-server'
            };

            return `
                <div class="connection-card bg-white rounded-xl shadow-lg p-6">
                    <div class="flex items-start justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                                <i class="fas ${protocolIcons[conn.protocol]} text-white text-xl"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-gray-800">${conn.id}</h3>
                                <p class="text-sm text-gray-500">${conn.protocol.toUpperCase()}</p>
                            </div>
                        </div>
                        <span class="status-dot ${statusColors[conn.status]}"></span>
                    </div>

                    <div class="space-y-2 mb-4 text-sm">
                        <div class="flex items-center text-gray-600">
                            <i class="fas fa-server w-5"></i>
                            <span>${conn.host}:${conn.port}</span>
                        </div>
                        <div class="flex items-center text-gray-600">
                            <i class="fas fa-folder w-5"></i>
                            <span>${conn.path}</span>
                        </div>
                        <div class="flex items-center text-gray-600">
                            <i class="fas fa-clock w-5"></i>
                            <span>${conn.status}</span>
                        </div>
                    </div>

                    <div class="flex gap-2">
                        ${conn.status === 'connected'
                            ? `<button onclick="disconnect('${conn.id}')" class="flex-1 bg-red-50 text-red-600 py-2 rounded-lg text-sm font-semibold hover:bg-red-100 transition-all">
                                <i class="fas fa-plug-circle-xmark mr-1"></i>Disconnect
                              </button>
                              <button onclick="browseFiles('${conn.id}')" class="flex-1 bg-blue-50 text-blue-600 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100 transition-all">
                                <i class="fas fa-folder-open mr-1"></i>Browse
                              </button>`
                            : `<button onclick="connect('${conn.id}')" class="flex-1 bg-green-50 text-green-600 py-2 rounded-lg text-sm font-semibold hover:bg-green-100 transition-all">
                                <i class="fas fa-plug-circle-check mr-1"></i>Connect
                              </button>`
                        }
                        <button onclick="removeConnection('${conn.id}')" class="bg-gray-100 text-gray-600 py-2 px-3 rounded-lg text-sm hover:bg-gray-200 transition-all">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        function updateStats() {
            document.getElementById('stat-total').textContent = connections.length;
            document.getElementById('stat-active').textContent = connections.filter(c => c.status === 'connected').length;
        }

        function showEmptyState() {
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('connections-grid').innerHTML = '';
        }

        function showAddConnectionModal() {
            document.getElementById('add-connection-modal').classList.remove('hidden');
            document.getElementById('add-connection-modal').classList.add('flex');
        }

        function hideAddConnectionModal() {
            document.getElementById('add-connection-modal').classList.add('hidden');
            document.getElementById('add-connection-modal').classList.remove('flex');
            document.getElementById('connection-form').reset();
        }

        function updateProtocolFields() {
            const protocol = document.querySelector('[name="protocol"]').value;
            const portField = document.querySelector('[name="port"]');
            const pathField = document.getElementById('path-field');

            if (protocol === 'webdav') {
                portField.placeholder = '80';
                pathField.style.display = 'block';
            } else if (protocol === 'ftp') {
                portField.placeholder = '21';
                pathField.style.display = 'none';
            }
        }

        document.getElementById('connection-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            const config = {
                protocol: formData.get('protocol'),
                host: formData.get('host'),
                port: parseInt(formData.get('port')) || (formData.get('protocol') === 'ftp' ? 21 : 80),
                path: formData.get('path') || '/',
                credentials: {
                    username: formData.get('username'),
                    password: formData.get('password')
                },
                persistent: formData.get('persistent') === 'on',
                autoReconnect: formData.get('autoReconnect') === 'on'
            };

            try {
                const response = await fetch(`${API_BASE}/api/network/connections`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                if (response.ok) {
                    hideAddConnectionModal();
                    loadConnections();
                } else {
                    alert('Failed to create connection');
                }
            } catch (error) {
                console.error('Error creating connection:', error);
                alert('Error creating connection');
            }
        });

        async function connect(connectionId) {
            try {
                await fetch(`${API_BASE}/api/network/connections/${connectionId}/connect`, {
                    method: 'POST'
                });
                await loadConnections();
            } catch (error) {
                console.error('Connection failed:', error);
            }
        }

        async function disconnect(connectionId) {
            try {
                await fetch(`${API_BASE}/api/network/connections/${connectionId}/disconnect`, {
                    method: 'POST'
                });
                await loadConnections();
            } catch (error) {
                console.error('Disconnect failed:', error);
            }
        }

        async function removeConnection(connectionId) {
            if (!confirm('Remove this connection?')) return;

            try {
                await fetch(`${API_BASE}/api/network/connections/${connectionId}`, {
                    method: 'DELETE'
                });
                await loadConnections();
            } catch (error) {
                console.error('Remove failed:', error);
            }
        }

        async function testConnection() {
            const formData = new FormData(document.getElementById('connection-form'));
            const config = {
                protocol: formData.get('protocol'),
                host: formData.get('host'),
                port: parseInt(formData.get('port')) || 21,
                path: formData.get('path') || '/',
                credentials: {
                    username: formData.get('username'),
                    password: formData.get('password')
                }
            };

            try {
                const response = await fetch(`${API_BASE}/api/network/test`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(config)
                });

                const result = await response.json();
                alert(result.success ? 'Connection successful!' : `Failed: ${result.message}`);
            } catch (error) {
                alert('Test failed: ' + error.message);
            }
        }

        async function browseFiles(connectionId) {
            currentConnectionId = connectionId;
            const conn = connections.find(c => c.id === connectionId);

            document.getElementById('browser-title').textContent = `File Browser - ${conn.id}`;
            document.getElementById('file-browser-modal').classList.remove('hidden');
            document.getElementById('file-browser-modal').classList.add('flex');

            await loadFiles('/');
        }

        function hideFileBrowser() {
            document.getElementById('file-browser-modal').classList.add('hidden');
            document.getElementById('file-browser-modal').classList.remove('flex');
            currentConnectionId = null;
        }

        async function loadFiles(path) {
            try {
                const conn = connections.find(c => c.id === currentConnectionId);
                const endpoint = conn.protocol === 'webdav' ? 'webdav/list' : 'ftp/list';

                const response = await fetch(`${API_BASE}/api/network/connections/${currentConnectionId}/${endpoint}?path=${encodeURIComponent(path)}`);
                const files = await response.json();

                document.getElementById('current-path').textContent = path;
                renderFiles(files, path);
            } catch (error) {
                console.error('Failed to load files:', error);
                document.getElementById('file-list').innerHTML = '<p class="text-red-500">Failed to load files</p>';
            }
        }

        function renderFiles(files, currentPath) {
            const fileList = document.getElementById('file-list');

            if (files.length === 0) {
                fileList.innerHTML = '<p class="text-gray-500">Empty directory</p>';
                return;
            }

            fileList.innerHTML = files.map(file => `
                <div class="flex items-center justify-between p-3 rounded-lg hover:bg-gray-50 cursor-pointer" onclick="${file.type === 'directory' ? `loadFiles('${currentPath}/${file.name}')` : ''}">
                    <div class="flex items-center gap-3">
                        <i class="fas ${file.type === 'directory' ? 'fa-folder text-yellow-500' : 'fa-file text-blue-500'} text-xl"></i>
                        <div>
                            <div class="font-medium text-gray-800">${file.name}</div>
                            <div class="text-xs text-gray-500">${file.size ? formatSize(file.size) : ''}</div>
                        </div>
                    </div>
                    ${file.type === 'file' ? `<button class="text-blue-500 hover:text-blue-700" onclick="event.stopPropagation(); downloadFile('${currentPath}/${file.name}')"><i class="fas fa-download"></i></button>` : ''}
                </div>
            `).join('');
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        async function downloadFile(path) {
            const conn = connections.find(c => c.id === currentConnectionId);
            const endpoint = conn.protocol === 'webdav' ? 'webdav/get' : 'ftp/get';
            window.location.href = `${API_BASE}/api/network/connections/${currentConnectionId}/${endpoint}?path=${encodeURIComponent(path)}`;
        }
    </script>
</body>
</html>

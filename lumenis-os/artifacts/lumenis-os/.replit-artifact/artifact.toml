kind = "web"
previewPath = "/"
title = "Lumenis OS"
version = "1.0.0"
id = "artifacts/lumenis-os"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22672

[services.development]
run = "pnpm --filter @workspace/lumenis-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lumenis-os", "run", "build" ]
publicDir = "artifacts/lumenis-os/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22672"
BASE_PATH = "/"

version: '3.8'

services:
  # Sovereign Council - Real NVIDIA API
  council:
    build:
      context: ./council
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_MODEL=meta/llama-3.3-70b-instruct
      - PYTHONUNBUFFERED=1
    networks:
      - one2lv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Core Server - Real Delta + Vector Memory
  core:
    build:
      context: .
      dockerfile: Dockerfile.core
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - COUNCIL_URL=http://council:8000
      - NODE_ENV=production
    volumes:
      - vector-data:/app/data
    depends_on:
      - council
    networks:
      - one2lv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Gateway - Routes to all services
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - GATEWAY_PORT=4000
      - COUNCIL_URL=http://council:8000
      - CORE_URL=http://core:3000
    depends_on:
      - council
      - core
    networks:
      - one2lv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  one2lv:
    driver: bridge

volumes:
  vector-data:
    driver: local
